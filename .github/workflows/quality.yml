name: Quality

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build development place
        run: make build

  tests:
    name: Jest on Open Cloud
    runs-on: ubuntu-latest
    needs: checks
    # Open Cloud refuses concurrent saves to the same place and limits task creates.
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install Wally packages
        run: wally install

      - name: Run Jest
        run: make test-on-ocale
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
